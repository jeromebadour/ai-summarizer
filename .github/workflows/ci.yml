name: CI

# Every push and pull request: types, lint, unit tests, every database suite, then the built app in a real browser
# against a fake Claude (no key, no cost). Nothing broken reaches the server.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      # Test-only values: this database lives for one CI run.
      DATABASE_URL: postgres://distill_app:ci-only@localhost:5432/distill
      ANTHROPIC_BASE_URL: http://127.0.0.1:4010
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types and lint
        run: |
          npx tsc --noEmit
          npx eslint src

      - name: Unit tests
        run: npm run test:unit

      - name: Database suites
        run: scripts/test-db.sh

      - name: App database
        run: |
          createdb distill
          for m in db/migrations/*.sql; do psql -X -q -v ON_ERROR_STOP=1 -d distill -f "$m"; done
          psql -X -q -d distill -c "alter role distill_app password 'ci-only'"

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Start the fake Claude and the app
        run: |
          nohup node tests/e2e/fake_claude.mjs > /tmp/fake-claude.log 2>&1 &
          nohup npx next start -p 3101 > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3101/login && exit 0; sleep 1; done
          echo "the app did not start"; cat /tmp/app.log; exit 1

      - name: Browser suites
        env:
          PGDATABASE: distill
        run: scripts/test-e2e.sh

      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 /tmp/app.log /tmp/fake-claude.log || true
          for f in /tmp/e2e-*.log; do echo "== $f"; tail -n 60 "$f"; done
