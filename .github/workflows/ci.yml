name: CI

# Every push and pull request. First the code: types, lint, unit tests, every database suite. Then what ships: the
# real image and compose.yaml (Postgres, the migration step, the app), with every browser suite run against that
# container and a fake Claude (no key, no cost). Nothing broken reaches the server.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types and lint
        run: |
          npm run typecheck
          npx eslint src

      - name: Unit tests
        run: npm run test:unit

      - name: Database suites
        run: scripts/test-db.sh

  container:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Test-only values for a stack that lives for one CI run.
      POSTGRES_PASSWORD: ci-owner-only
      DISTILL_APP_PASSWORD: 0123456789abcdef0123456789abcdef
      ANTHROPIC_API_KEY: test-key
      APP_COMMIT: ${{ github.sha }}
      COMPOSE: docker compose -f compose.yaml -f compose.ci.yaml
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-owner-only
      PGDATABASE: distill
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fake Claude
        run: nohup node tests/e2e/fake_claude.mjs 4010 0.0.0.0 > /tmp/fake-claude.log 2>&1 &

      - name: Build and start the stack
        run: |
          mkdir -p /tmp/distill-outbox && chmod 777 /tmp/distill-outbox
          $COMPOSE up -d --build
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:3101/login && exit 0; sleep 2; done
          echo "the app did not start"; $COMPOSE ps -a; $COMPOSE logs; exit 1

      - name: A second deploy applies nothing twice
        run: |
          out=$($COMPOSE run --rm migrate)
          echo "$out"
          if echo "$out" | grep -q applying; then echo "a migration ran twice"; exit 1; fi

      - name: The box's collector reports to the real database
        # The real script, as root, as the box runs it: it finds the stack by its labels and signs in over the
        # database container's own socket as distill_collector (migration 011).
        run: |
          sudo /usr/bin/python3 ops/collector.py --facts
          got=$(psql -Atc "select count(*) || ' ' || (select facts ? 'os' and facts ? 'appStartedAt' from server_facts) from server_samples")
          echo "readings, facts present: $got"
          [ "$got" = "1 true" ] || { echo "the collector did not report"; exit 1; }
          psql -qc "delete from server_samples; delete from server_facts"

      - name: A backup is made, and it restores
        # The real scripts, as root, as the box's timers run them: a checked pg_dump, then the restore test into a
        # scratch database, which must report every table back.
        run: |
          sudo BACKUP_DIR=/tmp/distill-backups ops/backup.sh
          sudo BACKUP_DIR=/tmp/distill-backups ops/restore-test.sh | tee /tmp/restore.txt
          grep -q "RESTORE OK" /tmp/restore.txt
          sudo test "$(sudo stat -c %a /tmp/distill-backups)" = 700
          sudo BACKUP_DIR=/tmp/distill-backups /usr/bin/python3 ops/collector.py --facts
          psql -Atc "select (facts->'backups'->>'count')::int >= 1 and (facts->'restore'->>'ok')::boolean from server_facts" | grep -qx t
          psql -qc "delete from server_samples; delete from server_facts"

      - name: The backup goes off the box encrypted, and that copy restores
        # The same scripts with the off-box copy on (ops/offsite.sh), pointed at a folder instead of R2: the dump is
        # encrypted with age before it leaves, the restore test then downloads and decrypts the newest copy and restores
        # it, and a failed upload fails the run and is recorded for the console.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone age > /dev/null
          sudo sh -c 'age-keygen -o /tmp/offsite-age.key 2> /dev/null'
          off="OFFSITE_REMOTE=:local:/tmp/offsite OFFSITE_KEY=/tmp/offsite-age.key BACKUP_DIR=/tmp/distill-backups"
          sudo env $off ops/backup.sh | tee /tmp/offsite.txt
          grep -q "kept off the box" /tmp/offsite.txt
          sudo sh -c 'head -c 21 "$(ls /tmp/offsite/*.age | head -1)"' | grep -q "age-encryption.org"
          sudo env $off ops/restore-test.sh | tee /tmp/restore-offsite.txt
          grep -q "from off the box" /tmp/restore-offsite.txt
          grep -q "RESTORE OK" /tmp/restore-offsite.txt
          if sudo env OFFSITE_REMOTE=:local:/proc/nope OFFSITE_KEY=/tmp/offsite-age.key BACKUP_DIR=/tmp/distill-backups ops/backup.sh; then
            echo "a failed upload did not fail the backup"; exit 1
          fi
          sudo BACKUP_DIR=/tmp/distill-backups /usr/bin/python3 ops/collector.py --facts
          psql -Atc "select (facts->'offsite'->>'ok') = 'false' and (facts->'restore'->>'from') = 'offsite' from server_facts" | grep -qx t
          psql -qc "delete from server_samples; delete from server_facts"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Browser
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Browser suites against the container
        run: scripts/test-e2e.sh

      - name: Logs on failure
        if: failure()
        run: |
          $COMPOSE ps -a || true
          $COMPOSE logs --tail 200 || true
          tail -n 100 /tmp/fake-claude.log || true
          for f in /tmp/e2e-*.log; do echo "== $f"; tail -n 60 "$f"; done
