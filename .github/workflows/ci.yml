name: CI

# Every push and pull request. First the code: types, lint, unit tests, every database suite. Then what ships: the
# real image and compose.yaml (Postgres, the migration step, the app), with every browser suite run against that
# container and a fake Claude (no key, no cost). Nothing broken reaches the server.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types and lint
        run: |
          npm run typecheck
          npx eslint src

      - name: Unit tests
        run: npm run test:unit

      - name: Database suites
        run: scripts/test-db.sh

  container:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Test-only values for a stack that lives for one CI run.
      POSTGRES_PASSWORD: ci-owner-only
      DISTILL_APP_PASSWORD: 0123456789abcdef0123456789abcdef
      ANTHROPIC_API_KEY: test-key
      APP_COMMIT: ${{ github.sha }}
      COMPOSE: docker compose -f compose.yaml -f compose.ci.yaml
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-owner-only
      PGDATABASE: distill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fake Claude
        run: nohup node tests/e2e/fake_claude.mjs 4010 0.0.0.0 > /tmp/fake-claude.log 2>&1 &

      - name: Build and start the stack
        run: |
          $COMPOSE up -d --build
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:3101/login && exit 0; sleep 2; done
          echo "the app did not start"; $COMPOSE ps -a; $COMPOSE logs; exit 1

      - name: A second deploy applies nothing twice
        run: |
          out=$($COMPOSE run --rm migrate)
          echo "$out"
          if echo "$out" | grep -q applying; then echo "a migration ran twice"; exit 1; fi

      - name: The box's collector reports to the real database
        # The real script, as root, as the box runs it: it finds the stack by its labels and signs in over the
        # database container's own socket as distill_collector (migration 011).
        run: |
          sudo /usr/bin/python3 ops/collector.py --facts
          got=$(psql -Atc "select count(*) || ' ' || (select facts ? 'os' and facts ? 'appStartedAt' from server_facts) from server_samples")
          echo "readings, facts present: $got"
          [ "$got" = "1 true" ] || { echo "the collector did not report"; exit 1; }
          psql -qc "delete from server_samples; delete from server_facts"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Browser suites against the container
        run: scripts/test-e2e.sh

      - name: Logs on failure
        if: failure()
        run: |
          $COMPOSE ps -a || true
          $COMPOSE logs --tail 200 || true
          tail -n 100 /tmp/fake-claude.log || true
          for f in /tmp/e2e-*.log; do echo "== $f"; tail -n 60 "$f"; done
